# nginx reverse-proxy config for the PhD Entrance Examination platform.
#
# Target: Hostinger KVM 4 VPS — 62.72.29.111 / srv1990910.hstgr.cloud
# Install as /etc/nginx/sites-available/phd-exam.conf, then:
#   ln -s /etc/nginx/sites-available/phd-exam.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Gunicorn (deploy/gunicorn.conf.py) binds to 127.0.0.1:8000 only — this is
# the sole entry point from the public internet.

upstream phd_exam_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 62.72.29.111 srv1990910.hstgr.cloud;

    # ------------------------------------------------------------------
    # Question-bank ZIP uploads and camera-frame JSON messages both need
    # generous body limits. Camera frames travel over the WebSocket (not
    # a regular HTTP body) so this mainly protects the admin ZIP/CSV
    # importer and the PDF/Excel export downloads.
    # ------------------------------------------------------------------
    client_max_body_size 50m;

    access_log /var/log/nginx/phd-exam.access.log;
    error_log  /var/log/nginx/phd-exam.error.log;

    # ------------------------------------------------------------------
    # Static assets served directly by nginx — never touches gunicorn/
    # the single application worker. Falls through to the app if a path
    # isn't found on disk (harmless 404 either way).
    # ------------------------------------------------------------------
    location /static/ {
        alias /var/www/phd-exam/frontend/static/;
        expires 7d;
        access_log off;
    }

    # ------------------------------------------------------------------
    # WebSockets — candidate proctoring feed and the admin live dashboard.
    # Both backend/routers/exam.py's /exam/ws/candidate and
    # backend/routers/admin.py's /ws/admin need the Upgrade/Connection
    # headers below, and a read timeout long enough that an idle
    # candidate mid-exam (server-side idle re-check is every 30s — see
    # CANDIDATE_WS_IDLE_TIMEOUT_SECONDS/ADMIN_WS_IDLE_TIMEOUT_SECONDS)
    # never gets cut by nginx itself.
    # ------------------------------------------------------------------
    location ~ ^/(exam/ws/candidate|ws/admin)$ {
        proxy_pass http://phd_exam_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A multi-hour exam window shouldn't ever have nginx close an
        # otherwise-healthy idle WebSocket out from under the app.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket frames must not be buffered — proctoring needs the
        # frame stream to arrive as it's produced, not batched.
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Everything else — the FastAPI app (HTML pages, REST API, PDF/Excel
    # export downloads, ZIP/CSV question-bank uploads).
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://phd_exam_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous but finite — matches gunicorn's own `timeout = 120`
        # (deploy/gunicorn.conf.py) with a little headroom, so a genuinely
        # hung request fails on the gunicorn side with a clear worker
        # timeout rather than nginx timing out first with a bare 504.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Liveness endpoint for uptime monitoring / load balancer health
    # checks — kept out of the access log to avoid noise.
    location /healthz {
        proxy_pass http://phd_exam_backend;
        access_log off;
    }
}

# ------------------------------------------------------------------------
# HTTPS: once a certificate is issued for srv1990910.hstgr.cloud (e.g. via
# certbot --nginx), certbot will rewrite the block above into an HTTP->
# HTTPS redirect and add the corresponding `listen 443 ssl;` server block
# automatically. Not included here since running an uninstalled-cert
# config would just fail nginx -t; see deploy/README.md.
# ------------------------------------------------------------------------
