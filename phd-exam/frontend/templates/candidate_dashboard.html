<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Dashboard — Ph.D Entrance Examination</title>
  <meta name="description" content="Ph.D Entrance Examination candidate dashboard. View your exam schedule and start your examination phases.">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    /* ===== Candidate Dashboard — white/light theme ===== */
    /* Uses the same design-system tokens as login.html / admin pages */

    .dash-header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--header-border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(15,23,42,.25);
    }
    .dash-header-left { display: flex; align-items: center; gap: 12px; }
    .dash-logo { height: 36px; border-radius: 6px; }
    .dash-title { font-size: 1rem; font-weight: 600; color: #ffffff; }
    .dash-subtitle { font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .dash-header-right { display: flex; align-items: center; gap: 12px; }
    .candidate-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      color: #fff;
      font-weight: 500;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #fca5a5; color: #fca5a5; }

    .dash-main {
      max-width: 860px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* Info card */
    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .info-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .info-candidate-name { font-size: 1.4rem; font-weight: 700; color: var(--text); font-family: var(--font-serif); }
    .info-candidate-email { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
    .exam-schedule-block { text-align: right; }
    .exam-schedule-label { font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
    .exam-schedule-time { font-size: 1rem; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .exam-schedule-date { font-size: 0.82rem; color: var(--text-faint); }

    /* Status ribbon */
    .status-ribbon {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 1.2rem;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status-ribbon.waiting  { background: var(--warning-soft); border: 1px solid #fcd34d; color: #92400e; }
    .status-ribbon.open     { background: var(--success-soft); border: 1px solid #6ee7b7; color: #065f46; }
    .status-ribbon.closed   { background: var(--danger-soft);  border: 1px solid #fca5a5; color: #991b1b; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .status-dot.pulse { animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
    .countdown-display {
      font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--warning); margin-top: 0.4rem;
      letter-spacing: 0.02em;
    }

    /* Phase cards */
    .phases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 600px) { .phases-grid { grid-template-columns: 1fr; } }

    .phase-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s;
    }
    .phase-card.active-phase  { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.12), var(--shadow-md); }
    .phase-card.completed-phase { border-color: var(--success); border-top: 3px solid var(--success); }
    .phase-card.locked-phase { opacity: 0.55; }

    .phase-number {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--text-faint);
    }
    .phase-title { font-size: 1.05rem; font-weight: 600; color: var(--text); margin-top: 2px; font-family: var(--font-serif); }
    .phase-questions { font-size: 0.82rem; color: var(--text-muted); }

    .phase-status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600;
      width: fit-content;
    }
    .phase-status-badge.not-started { background: #f1f5f9; color: var(--text-faint); border: 1px solid var(--border); }
    .phase-status-badge.in-progress { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-mid); }
    .phase-status-badge.completed   { background: var(--success-soft); color: var(--success-dark); border: 1px solid #6ee7b7; }
    .phase-status-badge.locked      { background: #f8fafc; color: var(--text-faint); border: 1px solid var(--border-soft); }

    .phase-completed-time { font-size: 0.78rem; color: var(--text-faint); }

    .phase-btn {
      width: 100%;
      padding: 0.75rem 1.2rem;
      border-radius: var(--radius-control);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .phase-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .phase-btn-start  { background: var(--accent); color: #fff; box-shadow: var(--shadow-md); }
    .phase-btn-start:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .phase-btn-resume { background: linear-gradient(135deg, #0ea5e9 0%, var(--accent) 100%); color: #fff; box-shadow: var(--shadow-md); }
    .phase-btn-resume:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .phase-btn-done { background: var(--success-soft); color: var(--success-dark); border: 1px solid #6ee7b7; cursor: default; font-weight: 600; }

    /* Instructions notice */
    .notice-card {
      background: var(--accent-soft);
      border: 1px solid var(--accent-mid);
      border-radius: var(--radius-control);
      padding: 1rem 1.2rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    /* Error state */
    .dash-error {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      border-radius: var(--radius-control);
      color: #b91c1c;
      padding: 1rem 1.2rem;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 1.2rem;
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-line { height: 14px; width: 100%; border-radius: 4px; }
    .loading-overlay { min-height: 200px; display: flex; align-items: center; justify-content: center; }

    /* Disqualified / completed notice */
    .terminal-notice {
      background: var(--panel);
      border-radius: var(--radius-card);
      padding: 2.5rem;
      text-align: center;
      border: 1px solid var(--border);
      margin-top: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .terminal-notice.success { border-color: #6ee7b7; border-top: 3px solid var(--success); }
    .terminal-notice.disqual { border-color: #fca5a5; border-top: 3px solid var(--danger); }
    .terminal-icon { font-size: 3rem; margin-bottom: 1rem; }
    .terminal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; font-family: var(--font-serif); }
    .terminal-body { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; max-width: 520px; margin: 0 auto; }
  </style>
</head>
<body>

<!-- Header -->
<header class="dash-header">
  <div class="dash-header-left">
    <img src="/static/img/logo.png" alt="DSIRT Logo" class="dash-logo" onerror="this.style.display='none'">
    <div>
      <div class="dash-title">Ph.D Entrance Examination</div>
      <div class="dash-subtitle">Dhanalakshmi Srinivasan Institute of Research and Technology</div>
    </div>
  </div>
  <div class="dash-header-right">
    <span class="candidate-badge" id="candidateNameBadge">Loading…</span>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</header>

<!-- Main content -->
<main class="dash-main">
  <div class="dash-error" id="dashError"></div>
  <div id="dashContent">
    <div class="loading-overlay">
      <div style="width:100%">
        <div class="skeleton skeleton-line" style="width:60%; margin-bottom:12px;"></div>
        <div class="skeleton skeleton-line" style="width:40%; margin-bottom:12px;"></div>
        <div class="skeleton skeleton-line" style="width:80%;"></div>
      </div>
    </div>
  </div>
</main>

<script>
(async () => {
  const token = localStorage.getItem('access_token');
  const role  = localStorage.getItem('role');
  if (!token || role !== 'candidate') {
    window.location.href = '/login';
    return;
  }

  const nameEl   = document.getElementById('candidateNameBadge');
  const errorEl  = document.getElementById('dashError');
  const contentEl= document.getElementById('dashContent');

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    window.location.href = '/login';
  });

  // ── API helper ──────────────────────────────────────────────
  async function api(path) {
    try {
      const res = await fetch(path, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; return null; }
      return await res.json();
    } catch { return null; }
  }

  // ── Format helpers ──────────────────────────────────────────
  function fmtIST(utcStr) {
    if (!utcStr) return '—';
    // Parse UTC, add IST offset (+5:30)
    const d = new Date(utcStr.endsWith('Z') ? utcStr : utcStr + 'Z');
    return d.toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata',
      year: 'numeric', month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }

  function fmtTime(utcStr) {
    if (!utcStr) return '—';
    const d = new Date(utcStr.endsWith('Z') ? utcStr : utcStr + 'Z');
    return d.toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }

  function fmtDateShort(utcStr) {
    if (!utcStr) return '';
    const d = new Date(utcStr.endsWith('Z') ? utcStr : utcStr + 'Z');
    return d.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ── Countdown timer ─────────────────────────────────────────
  let countdownHandle = null;
  function startCountdown(el, secondsRemaining) {
    if (countdownHandle) clearInterval(countdownHandle);
    function tick() {
      if (secondsRemaining <= 0) {
        clearInterval(countdownHandle);
        el.textContent = 'Starting…';
        setTimeout(() => window.location.reload(), 2000);
        return;
      }
      const h = Math.floor(secondsRemaining / 3600);
      const m = Math.floor((secondsRemaining % 3600) / 60);
      const s = secondsRemaining % 60;
      el.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
      secondsRemaining--;
    }
    tick();
    countdownHandle = setInterval(tick, 1000);
  }

  // ── Phase status badge HTML ─────────────────────────────────
  function phaseBadge(status) {
    const icons = {
      not_started: '○',
      in_progress: '◉',
      completed:   '✓',
      locked:      '🔒',
      ready:       '▶',
    };
    const labels = {
      not_started: 'Not Started',
      in_progress: 'In Progress',
      completed:   'Completed',
      locked:      'Locked',
      ready:       'Ready to Start',
    };
    const cls = status === 'not_started' ? 'not-started'
              : status === 'in_progress' ? 'in-progress'
              : status === 'completed'   ? 'completed'
              : status === 'ready'       ? 'in-progress'
              : 'locked';
    return `<span class="phase-status-badge ${cls}">${icons[status] || '○'} ${labels[status] || status}</span>`;
  }

  // ── Render dashboard ────────────────────────────────────────
  function renderDashboard(d) {
    nameEl.textContent = d.full_name;

    const examOpen       = d.exam_open;
    const secUntilStart  = d.seconds_until_start || 0;
    const sessionStatus  = d.session_status;
    const p1Status       = d.phase1_status;   // not_started | in_progress | completed
    const p2Status       = d.phase2_status;   // locked | ready | in_progress | completed
    const hasActive      = d.has_active_session;

    // ── Terminal states ──────────────────────────────────────
    if (sessionStatus === 'completed' || sessionStatus === 'expired') {
      contentEl.innerHTML = `
        <div class="terminal-notice success">
          <div class="terminal-icon">✅</div>
          <div class="terminal-title" style="color:var(--success-dark)">Examination Completed</div>
          <div class="terminal-body">
            Your examination has been submitted successfully.<br><br>
            Your responses have been recorded.<br>
            Results will be processed by the examination administrator.<br><br>
            <span style="color:var(--text-faint); font-size:0.82rem">
              Completed at: ${fmtIST(d.phase2_submitted_at || d.phase1_submitted_at)}
            </span>
          </div>
        </div>`;
      return;
    }

    if (sessionStatus === 'disqualified') {
      contentEl.innerHTML = `
        <div class="terminal-notice disqual">
          <div class="terminal-icon">🚫</div>
          <div class="terminal-title" style="color:var(--danger)">Examination Access Revoked</div>
          <div class="terminal-body">
            Your examination access has been revoked by the administrator.<br><br>
            Please contact the examination cell for further information.
          </div>
        </div>`;
      return;
    }

    // ── Schedule block ───────────────────────────────────────
    const schedStart = d.scheduled_start_at ? fmtTime(d.scheduled_start_at) : '—';
    const schedEnd   = d.scheduled_end_at   ? fmtTime(d.scheduled_end_at)   : '—';
    const schedDate  = d.scheduled_start_at ? fmtDateShort(d.scheduled_start_at) : '';

    // ── Status ribbon ────────────────────────────────────────
    let statusRibbonHtml = '';
    let countdownHtml    = '';

    if (!examOpen && secUntilStart > 0) {
      statusRibbonHtml = `
        <div class="status-ribbon waiting">
          <span class="status-dot pulse"></span>
          <span>Exam not yet started — please wait</span>
        </div>
        <div class="countdown-display" id="countdownEl">--:--:--</div>
        <div style="font-size:0.8rem; color:var(--text-faint); margin-top:4px">Time until exam begins</div>`;
    } else if (!examOpen && secUntilStart === 0) {
      statusRibbonHtml = `
        <div class="status-ribbon closed">
          <span class="status-dot"></span>
          <span>Examination is closed</span>
        </div>`;
    } else if (examOpen) {
      statusRibbonHtml = `
        <div class="status-ribbon open">
          <span class="status-dot pulse"></span>
          <span>Examination is LIVE — you may proceed</span>
        </div>`;
    }

    // ── Phase 1 button ───────────────────────────────────────
    let p1Btn = '';
    let p1CompletedHtml = '';
    if (p1Status === 'completed') {
      const t = d.phase1_submitted_at ? fmtIST(d.phase1_submitted_at) : '';
      p1CompletedHtml = `<div class="phase-completed-time">Completed at: ${t}</div>`;
      p1Btn = `<button class="phase-btn phase-btn-done" disabled>✓ Phase 1 Submitted</button>`;
    } else if (p1Status === 'in_progress') {
      p1Btn = `<button class="phase-btn phase-btn-resume" id="resumePhase1Btn">↩ Resume Phase 1</button>`;
    } else if (p1Status === 'not_started' && examOpen) {
      p1Btn = `<button class="phase-btn phase-btn-start" id="startPhase1Btn">▶ Start Phase 1</button>`;
    } else {
      p1Btn = `<button class="phase-btn phase-btn-start" disabled>▶ Start Phase 1</button>`;
    }

    // ── Phase 2 button ───────────────────────────────────────
    let p2Btn = '';
    let p2CompletedHtml = '';
    if (p2Status === 'completed') {
      const t = d.phase2_submitted_at ? fmtIST(d.phase2_submitted_at) : '';
      p2CompletedHtml = `<div class="phase-completed-time">Completed at: ${t}</div>`;
      p2Btn = `<button class="phase-btn phase-btn-done" disabled>✓ Phase 2 Submitted</button>`;
    } else if (p2Status === 'in_progress') {
      p2Btn = `<button class="phase-btn phase-btn-resume" id="resumePhase2Btn">↩ Resume Phase 2</button>`;
    } else if (p2Status === 'ready' && examOpen) {
      p2Btn = `<button class="phase-btn phase-btn-start" id="startPhase2Btn">▶ Start Phase 2</button>`;
    } else if (p2Status === 'locked') {
      p2Btn = `<button class="phase-btn phase-btn-start" disabled style="opacity:0.3">🔒 Locked</button>`;
    } else {
      p2Btn = `<button class="phase-btn phase-btn-start" disabled>▶ Start Phase 2</button>`;
    }

    const p1CardClass = p1Status === 'in_progress' ? 'active-phase'
                      : p1Status === 'completed'   ? 'completed-phase' : '';
    const p2CardClass = p2Status === 'in_progress' ? 'active-phase'
                      : p2Status === 'completed'   ? 'completed-phase'
                      : p2Status === 'locked'      ? 'locked-phase' : '';

    contentEl.innerHTML = `
      <!-- Candidate info card -->
      <div class="info-card">
        <div class="info-card-header">
          <div>
            <div class="info-candidate-name">${escHtml(d.full_name)}</div>
            <div class="info-candidate-email">${escHtml(d.email)}</div>
          </div>
          <div class="exam-schedule-block">
            <div class="exam-schedule-label">Exam Schedule</div>
            <div class="exam-schedule-time">${schedStart} – ${schedEnd}</div>
            <div class="exam-schedule-date">${schedDate}</div>
          </div>
        </div>
        ${statusRibbonHtml}
      </div>

      <!-- Phase cards -->
      <div class="phases-grid">
        <!-- Phase 1 -->
        <div class="phase-card ${p1CardClass}">
          <div>
            <div class="phase-number">Phase 1</div>
            <div class="phase-title">Research Methodology</div>
            <div class="phase-questions">50 Questions · MCQ</div>
          </div>
          ${phaseBadge(p1Status)}
          ${p1CompletedHtml}
          ${p1Btn}
        </div>

        <!-- Phase 2 -->
        <div class="phase-card ${p2CardClass}">
          <div>
            <div class="phase-number">Phase 2</div>
            <div class="phase-title">Domain Specific</div>
            <div class="phase-questions">50 Questions · MCQ</div>
          </div>
          ${phaseBadge(p2Status)}
          ${p2CompletedHtml}
          ${p2Btn}
          ${p2Status === 'locked' ? '<div style="font-size:0.78rem; color:#64748b;">Available after Phase 1 is completed</div>' : ''}
        </div>
      </div>

      <!-- Notice -->
      <div class="notice-card">
        <span>ℹ️</span>
        <div>
          <strong>Important:</strong> Do not close your browser during the examination.
          Answers are saved automatically. Results will be processed by the administrator —
          scores will not be shown to candidates.
        </div>
      </div>
    `;

    // Bind button events
    const s1 = document.getElementById('startPhase1Btn');
    if (s1) s1.addEventListener('click', () => enterExam('phase1'));

    const r1 = document.getElementById('resumePhase1Btn');
    if (r1) r1.addEventListener('click', () => enterExam('phase1'));

    const s2 = document.getElementById('startPhase2Btn');
    if (s2) s2.addEventListener('click', () => enterExam('phase2'));

    const r2 = document.getElementById('resumePhase2Btn');
    if (r2) r2.addEventListener('click', () => enterExam('phase2'));

    // Start countdown if exam hasn't opened
    if (secUntilStart > 0) {
      const el = document.getElementById('countdownEl');
      if (el) startCountdown(el, secUntilStart);
    }
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function enterExam(phase) {
    // Store which phase we're entering so exam.js knows
    sessionStorage.setItem('exam_phase_entry', phase);
    window.location.href = '/candidate/exam';
  }

  // ── Load dashboard ───────────────────────────────────────────
  const data = await api('/exam/dashboard');
  if (!data) {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Could not load dashboard. Please refresh.';
    contentEl.innerHTML = '';
    return;
  }

  // Set name immediately
  nameEl.textContent = data.full_name;
  renderDashboard(data);

  // Poll every 10 seconds for exam state changes (countdown, exam open)
  setInterval(async () => {
    const updated = await api('/exam/dashboard');
    if (updated) renderDashboard(updated);
  }, 10000);
})();
</script>
</body>
</html>
