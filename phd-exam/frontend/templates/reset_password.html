<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password — PhD Entrance Examination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="eyebrow">One-time step</div>
      <h1>Set a new password</h1>
      <p class="sub">Your temporary password can't be used again. Choose a new one to continue to the exam.</p>

      <div class="form-error" id="resetError"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Continue</button>
      </form>
      <p class="form-hint">Minimum 8 characters. This replaces the temporary password permanently.</p>
    </div>
  </div>

  <script src="/static/js/reset_password.js"></script>
</body>
</html>
