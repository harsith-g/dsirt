<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/dashboard" style="text-decoration:none;color:inherit">
      <img class="logo" src="{{ logo_url }}" alt="{{ app_name }}">
      <span class="brand-text">
        <span class="brand-title">Ph.D. Entrance Examination</span>
        <span class="brand-sub">{{ candidate.full_name }} &middot; {{ candidate.registration_number }}</span>
      </span>
    </a>
    <nav class="navlinks">
      <a href="/dashboard" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    </nav>
    <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("logoutBtn");
  if (!btn) return;
  btn.addEventListener("click", async function () {
    try { await Portal.api("/api/auth/candidate/logout", { method: "POST" }); } catch (e) {}
    window.location.href = "/login";
  });
});
</script>
