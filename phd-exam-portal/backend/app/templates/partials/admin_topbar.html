<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/admin/dashboard" style="text-decoration:none;color:inherit">
      <img class="logo" src="{{ logo_url }}" alt="{{ app_name }}">
      <span class="brand-text">
        <span class="brand-title">Examination Control</span>
        <span class="brand-sub">{{ admin.email }} &middot; {{ admin.role.value.replace('_', ' ').title() }}</span>
      </span>
    </a>
    <nav class="navlinks">
      <a href="/admin/dashboard"  class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="/admin/proctoring" class="{{ 'active' if active == 'proctoring' }}">Live proctoring</a>
      <a href="/admin/questions"  class="{{ 'active' if active == 'questions' }}">Question bank</a>
      <a href="/admin/candidates" class="{{ 'active' if active == 'candidates' }}">Candidates</a>
    </nav>
    <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("logoutBtn");
  if (!btn) return;
  btn.addEventListener("click", async function () {
    try { await Portal.api("/api/auth/admin/logout", { method: "POST" }); } catch (e) {}
    window.location.href = "/admin/login";
  });
});
</script>
