user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  70;
    server_tokens   off;

    # Snapshot data-URLs ride inside the violation POST body.
    client_max_body_size 12m;
    client_body_timeout  60s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WebSocket upgrade: "" when the client sent no Upgrade header, so
    # ordinary requests are not broken by a stale Connection: upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=40r/s;

    upstream examportal {
        server backend:8000;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
