# Plain HTTP. This is the only server block active out of the box, because
# Nginx refuses to start if an `ssl_certificate` path does not exist -- so the
# TLS block lives in `ssl.conf.disabled` until certbot has issued one.
#
# To enable HTTPS:
#   1. point your domain at this host and set CERTBOT_DOMAIN/CERTBOT_EMAIL in .env
#   2. docker compose run --rm certbot
#   3. mv nginx/conf.d/ssl.conf.disabled nginx/conf.d/ssl.conf
#      (edit the two ssl_certificate paths to your domain)
#   4. uncomment the redirect below, set COOKIE_SECURE=true in .env
#   5. docker compose restart nginx backend

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Step 4: force TLS -------------------------------------------------
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/conf.d/_proxy.inc;
}
