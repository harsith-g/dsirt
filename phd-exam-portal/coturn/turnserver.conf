# Coturn -- STUN/TURN for the proctoring feeds.
#
# Runs with network_mode: host because TURN allocates a wide UDP relay port
# range that is impractical to publish through Docker's NAT.
#
# Before going live, set `realm`, `external-ip` and a strong `user` password,
# and open UDP 3478 plus the relay range on the firewall.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech

# Change this password. It is embedded in the ICE config handed to browsers,
# so treat it as a shared secret with a short rotation, not a real credential.
user=examportal:turnsecret
realm=exam.example.edu

# Set to the server's public IPv4 address. Without it, relay candidates carry
# the container's private address and remote candidates can never connect.
# external-ip=203.0.113.10

min-port=49160
max-port=49200

# Do not relay to internal ranges: a TURN server open to RFC1918 space is an
# SSRF pivot into the rest of the compose network.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log
