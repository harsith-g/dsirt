# /etc/nginx/sites-available/exam  (then: ln -s ../sites-available/exam /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx)
# Use certbot for HTTPS:  certbot --nginx -d dsirt-phdexam.tech -d www.dsirt-phdexam.tech
# The camera ONLY works on https:// (browsers block cameras on plain http).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name dsirt-phdexam.tech www.dsirt-phdexam.tech;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (live camera + admin monitor). Without these two lines the admin sees no video.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
